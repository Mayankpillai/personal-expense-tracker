services:
  app:
    build: .
    container_name: expense_tracker_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/expense_tracker
      - NODE_ENV=production
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6
    container_name: expense_tracker_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
